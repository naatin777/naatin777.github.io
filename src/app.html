<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- GitHub Pages cannot set response headers, so CSP is delivered via meta.
         The ws:// localhost entries keep Vite HMR working in dev without
         opening production to arbitrary websocket origins. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws://localhost:* ws://127.0.0.1:*; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
    <link rel="alternate" type="application/rss+xml" title="RSS" href="%sveltekit.assets%/feed.xml" />
    <!-- meta theme-color and the theme/lang init script are appended to
         <head> by src/hooks.server.ts (generated from shared constants).
         Do not write a literal closing head tag in this file — the injector
         matches on it. -->
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
