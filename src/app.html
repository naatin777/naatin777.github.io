<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- GitHub Pages cannot set response headers, so CSP is delivered via meta. ws: keeps Vite HMR working in dev. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fafafa" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
    <link rel="alternate" type="application/rss+xml" title="RSS" href="%sveltekit.assets%/feed.xml" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("theme");
          const preference = stored === "light" || stored === "dark" ? stored : "system";
          const dark =
            preference === "dark" || (preference === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          const root = document.documentElement;
          root.dataset.themePreference = preference;
          root.dataset.theme = dark ? "dark" : "light";
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = dark ? "#0a0a0a" : "#fafafa";

          // keep the lang whitelist in sync with `langs` in src/lib/config/i18n.ts
          const param = new URLSearchParams(location.search).get("lang");
          const saved = localStorage.getItem("lang");
          const lang = param === "en" || param === "ja" ? param : saved === "en" || saved === "ja" ? saved : "ja";
          root.lang = lang;
          if (param === "en" || param === "ja") localStorage.setItem("lang", lang);
        } catch {
          // storage disabled etc. — fall through to defaults
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
