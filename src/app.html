<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The CSP meta is generated by kit.csp (hash mode) during prerender;
         vite.config.ts hashes every bare <script> in this file into
         script-src, so keep additions attribute-free or they won't be
         signed and the browser will block them. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fafafa" />
    <!-- Pre-paint theme/lang init so neither flashes wrong. The values
         duplicate src/lib/config/theme.ts and src/lib/config/i18n.ts by
         hand — keep them in sync. -->
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("theme");
          const preference = stored === "light" || stored === "dark" ? stored : "system";
          const dark =
            preference === "dark" || (preference === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          const root = document.documentElement;
          root.dataset.themePreference = preference;
          root.dataset.theme = dark ? "dark" : "light";
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = dark ? "#0a0a0a" : "#fafafa";
          const langs = ["ja", "en"];
          const storedLang = localStorage.getItem("lang");
          root.lang = langs.includes(storedLang) ? storedLang : "ja";
        } catch {
          // fall through to markup defaults
        }
      })();
    </script>
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
    <link rel="alternate" type="application/rss+xml" title="RSS" href="%sveltekit.assets%/feed.xml" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" data-sveltekit-preload-code="viewport">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
