<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- GitHub Pages cannot set response headers, so CSP is delivered via meta.
         The ws:// localhost entries keep Vite HMR working in dev without
         opening production to arbitrary websocket origins. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws://localhost:* ws://127.0.0.1:*; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fafafa" />
    <!-- Pre-paint theme/lang init so neither flashes wrong. The values
         duplicate src/lib/config/theme.ts and src/lib/config/i18n.ts by
         hand — keep them in sync. -->
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("theme");
          const preference = stored === "light" || stored === "dark" ? stored : "system";
          const dark =
            preference === "dark" || (preference === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          const root = document.documentElement;
          root.dataset.themePreference = preference;
          root.dataset.theme = dark ? "dark" : "light";
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = dark ? "#0a0a0a" : "#fafafa";
          const langs = ["ja", "en"];
          const storedLang = localStorage.getItem("lang");
          root.lang = langs.includes(storedLang) ? storedLang : "ja";
        } catch {
          // fall through to markup defaults
        }
      })();
    </script>
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
    <link rel="alternate" type="application/rss+xml" title="RSS" href="%sveltekit.assets%/feed.xml" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
