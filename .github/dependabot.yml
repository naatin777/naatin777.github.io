version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # wait a few days after release so freshly-published compromised
    # versions are more likely to have been caught and yanked
    cooldown:
      default-days: 7
    groups:
      production-dependencies:
        dependency-type: production
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
