name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  # weekly rebuild to refresh Zenn article dates fetched at build time
  schedule:
    - cron: "0 0 * * 0"

# scope per ref so a PR run can't cancel an in-flight main deploy
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.1

      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # headless shell is enough for mermaid rendering and OG screenshots
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Check and lint
        run: pnpm run validate

      - name: Build
        run: pnpm run build

      - name: Lighthouse audit
        run: node scripts/lighthouse.mjs

      - name: Deploy
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build
