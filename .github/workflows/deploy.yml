name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  # weekly rebuild to refresh externally-synced article metadata
  schedule:
    - cron: "0 0 * * 0"

# scope per ref so a PR run can't cancel an in-flight main deploy
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# the build job runs PR-controlled code — it gets no write access; only the
# deploy job (main branch only) can push to gh-pages
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.1

      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # headless shell is enough for mermaid rendering and OG screenshots
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Check and lint
        run: pnpm run validate

      # PR builds skip this: they only need the committed generated files,
      # and running PR-controlled code with network egress adds attack
      # surface for no benefit.
      - name: Sync external posts
        if: github.event_name != 'pull_request'
        run: pnpm sync:external-posts

      - name: Build
        run: pnpm run build

      - name: Lighthouse audit
        run: node scripts/lighthouse.ts

      - name: Upload site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: build
          retention-days: 1
          # .nojekyll must survive or Pages would Jekyll-process the site
          include-hidden-files: true

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build
