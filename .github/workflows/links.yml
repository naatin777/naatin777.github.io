name: Link check

on:
  workflow_dispatch:
  # weekly — catches dead links in posts
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.1

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # fail the job on broken links so the weekly run notifies us
          fail: true
          args: >-
            --verbose --no-progress --max-retries 3
            --exclude-loopback --exclude-mail
            './content/**/*.md' './README.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
